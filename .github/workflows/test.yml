name: テスト

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: テスト（${{ matrix.os }}・Node.js ${{ matrix.node }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7
      - name: Node.js を用意
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: 依存を導入
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 構文を確認
        shell: bash
        run: |
          for f in *.mjs scripts/*.mjs test/*.mjs bench/*.mjs; do node --check "$f"; done
      - name: 試験
        run: npm test
